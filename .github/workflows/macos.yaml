name: C++ SFML (macOS)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install SFML via Homebrew
      run: brew install sfml

    - name: Build
      run: clang++ -std=c++20 src/*.cpp -I/opt/homebrew/include -L/opt/homebrew/lib -lsfml-graphics -lsfml-window -lsfml-system -o program

    - name: Test
      run: ./program --test
      continue-on-error: true
